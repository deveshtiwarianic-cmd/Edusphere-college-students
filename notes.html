<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Notes | EduSphere</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#172044,#070713 55%);color:#fff;min-height:100vh;padding:24px 16px 100px}.wrap{max-width:650px;margin:auto}.back{display:inline-block;color:#8feaff;text-decoration:none;margin-bottom:20px}.card{background:rgba(15,18,38,.9);border:1px solid rgba(0,229,255,.18);border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}h1{margin:0 0 8px;font-size:30px}p{color:#b8c2dc;line-height:1.6}.upload{display:block;border:1.5px dashed #00d9ff;border-radius:18px;padding:28px;text-align:center;cursor:pointer;margin:22px 0;background:rgba(0,229,255,.05)}.upload input{display:none}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;background:#00d9ff;color:#06101a;cursor:pointer}.btn:disabled{opacity:.5}.file{margin:12px 0;color:#9fefff}.status{margin-top:14px;color:#ffd36b}.result{margin-top:22px;display:none}.result h2{font-size:20px}.result pre{white-space:pre-wrap;font-family:inherit;line-height:1.65;color:#e9edff}.nav{position:fixed;left:10px;right:10px;bottom:10px;height:64px;display:flex;justify-content:space-around;align-items:center;background:rgba(7,7,19,.95);border:1px solid rgba(0,229,255,.18);border-radius:18px;z-index:10}.nav a{color:#b9c3dd;text-decoration:none;text-align:center;font-size:12px}.nav span{display:block;font-size:20px}.nav .active{color:#00e5ff}@media(min-width:769px){.nav{max-width:650px;margin:auto}}
</style></head><body><div class="wrap"><a class="back" href="explore.html">← Back to Explore</a><div class="card"><h1>📄 AI Notes</h1><p>Apni study PDF upload karo aur EduSphere AI uski simple summary aur important points banayega.</p><label class="upload">📎<br><b>Upload Notes / PDF</b><br><small>PDF up to 8 MB</small><input id="pdf" type="file" accept="application/pdf"></label><div id="file" class="file">No PDF selected</div><button id="go" class="btn" disabled>✨ Generate Summary</button><div id="status" class="status"></div><div id="result" class="result"><h2>📝 Summary</h2><pre id="summary"></pre></div></div></div><nav class="nav"><a href="index.html"><span>⌂</span>Home</a><a class="active" href="explore.html"><span>▣</span>Explore</a><a href="calculator.html"><span>🧮</span>Calc</a><a href="ai.html"><span>🤖</span>AI Help</a><a href="mentors.html"><span>♙</span>Mentors</a><a href="join.html"><span>＋</span>Join</a></nav><script>
const pdf=document.getElementById('pdf'),fileEl=document.getElementById('file'),go=document.getElementById('go'),status=document.getElementById('status'),result=document.getElementById('result'),summary=document.getElementById('summary');let selected=null;
pdf.addEventListener('change',()=>{selected=pdf.files[0]||null;if(!selected){fileEl.textContent='No PDF selected';go.disabled=true;return}if(selected.type!=='application/pdf'){status.textContent='Please select a PDF file.';go.disabled=true;return}if(selected.size>8*1024*1024){status.textContent='PDF is too large. Maximum size is 8 MB.';go.disabled=true;return}fileEl.textContent='Selected: '+selected.name;status.textContent='';go.disabled=false});
go.addEventListener('click',async()=>{if(!selected)return;go.disabled=true;status.textContent='AI PDF read kar raha hai…';result.style.display='none';try{const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(selected)});const res=await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:dataUrl,filename:selected.name})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Summary failed');summary.textContent=data.text||'No summary generated.';result.style.display='block';status.textContent='✅ Summary ready';}catch(e){status.textContent='❌ '+e.message}finally{go.disabled=false}});
</script></body></html>
